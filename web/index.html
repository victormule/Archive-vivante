<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performance Archive — archive vivante de performances en 3D</title>
    <meta name="description" content="Archive vivante de performances captées en Gaussian splatting et en photogrammétrie : des sessions à revisiter en 3D, avec le son et le trajet de caméra d'origine." />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Performance Archive" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Performance Archive — archive vivante de performances en 3D" />
    <meta property="og:description" content="Des performances captées en Gaussian splatting et en photogrammétrie, à revisiter en 3D avec le son et le trajet de caméra d'origine." />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vue 3D d'une session de Performance Archive" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/sessions/index.json" as="fetch" crossorigin />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Performance Archive",
        "url": "%VITE_SITE_URL%/",
        "inLanguage": "fr",
        "description": "Archive vivante de performances captées en Gaussian splatting et en photogrammétrie, à revisiter en 3D avec le son et le trajet de caméra d'origine."
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div class="session">
        <div class="session__loader" role="status">
          <h1 class="visually-hidden">Performance Archive</h1>
          <div class="loader__bar"><span></span></div>
          <p class="loader__label">Chargement de la session…</p>
        </div>
      </div>
    </div>
    <noscript>
      <style>.session { display: none; }</style>
      <p class="app-error">Performance Archive est une archive de performances à parcourir en 3D : elle demande JavaScript et WebGL.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
